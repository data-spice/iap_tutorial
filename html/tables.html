<!DOCTYPE html>
<html>
    <head>
        <title>Tables in html</title>
    </head>
<body>
    <h1>Store Manager</h1>
    <hr>
    <h2>Store data</h2>
    <table border="4" style="background-color:beige">
        <tr style="background-color:aquamarine">
            <th width="150">Monday</th>
            <th width="150">Tuesday</th>
            <th width="150">Wednesday</th>
            <th width="150" >Thursday</th>
            <th width="150">Friday</th>
            <th width="150">Saturday</th>
            <th width="150">Sunday</th>
        </tr>
        <tr align="center" style="background-color:chocolate">
            <td>9:00am-5:00 pm</td>
            <td>9:00am-5:00 pm</td>
            <td>9:00am-5:00 pm</td>
            <td>9:00am-5:00 pm</td>
            <td>9:00am-5:00 pm</td>
            <td>12:00noon-4:00pm</td>
            <td><em>Closed</em></td>
        </tr>
    </table>
</body>
    

</html>
